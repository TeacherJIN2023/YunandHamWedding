<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>성진 ♥ 지우 결혼합니다</title>
  <meta name="description" content="2027년 3월 27일 토요일 낮 12시, 그래비티 조선 서울 판교 오토그래프 컬렉션">

  <!-- 카카오톡·메신저 공유 미리보기 (배포 후 og:image, og:url 은 https:// 로 시작하는 전체 주소로 바꿔주세요. README 참고) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="성진 ♥ 지우 결혼합니다">
  <meta property="og:description" content="2027년 3월 27일 토요일 낮 12시 · 그래비티 조선 서울 판교">
  <meta property="og:image" content="images/og.jpg">
  <meta property="og:url" content="">

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- 고정 버튼: 음악 -->
    <button class="icon-btn music-btn" id="musicBtn" aria-label="배경음악 켜기/끄기" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path id="musicIcon" fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>

    <main id="main"></main>

    <!-- 고정 버튼: 맨 위로 / 공유 -->
    <div class="fabs">
      <button class="icon-btn round" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg>
      </button>
      <button class="icon-btn round" id="shareBtn" aria-label="공유하기">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18 16.1c-.8 0-1.5.3-2 .8l-7.1-4.2a3 3 0 0 0 0-1.4L16 7.2A3 3 0 1 0 15 5a3 3 0 0 0 .1.7L8 9.9a3 3 0 1 0 0 4.2l7.1 4.2a2.8 2.8 0 0 0-.1.7 3 3 0 1 0 3-2.9z"/></svg>
      </button>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <!-- 혼주 연락 모달 -->
    <div class="modal" id="contactModal" hidden>
      <div class="modal-card">
        <h3>혼주에게 연락하기</h3>
        <div id="contactList"></div>
        <button class="btn ghost" data-close>닫기</button>
      </div>
    </div>

    <!-- 사진 확대 -->
    <div class="lightbox" id="lightbox" hidden>
      <button class="lb-close" data-close aria-label="닫기">✕</button>
      <button class="lb-nav prev" aria-label="이전">‹</button>
      <img id="lbImg" alt="">
      <button class="lb-nav next" aria-label="다음">›</button>
      <div class="lb-count" id="lbCount"></div>
    </div>
  </div>

  <audio id="bgm" loop preload="none"></audio>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
